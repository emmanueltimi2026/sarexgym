name: production-checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: sarex_test, POSTGRES_USER: sarex, POSTGRES_PASSWORD: sarex_test }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sarex -d sarex_test" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sarex:sarex_test@localhost:5432/sarex_test
      TEST_DATABASE_URL: postgresql://sarex:sarex_test@localhost:5432/sarex_test
      APP_ORIGIN: http://localhost:3000
      QR_SIGNING_SECRET: ci-only-signing-secret-with-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 10 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:migrate
      - run: pnpm check
