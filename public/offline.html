<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#111111" />
    <meta name="robots" content="noindex,nofollow" />
    <title>You’re offline | SAREX Fitness Clinic</title>
    <style>
      * { box-sizing: border-box; }
      body { min-height: 100svh; margin: 0; display: grid; place-items: center; padding: 24px; color: #f8f8f8; background: radial-gradient(ellipse at 50% 0%, #321014 0%, #161616 48%, #0d0d0d 100%); font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 440px); padding: 34px; border: 1px solid #363638; border-radius: 24px; background: rgba(24,24,25,.94); box-shadow: 0 24px 80px #0008; text-align: center; }
      img { display: block; width: min(210px, 70%); height: auto; margin: 0 auto 28px; }
      .mark { display: grid; width: 58px; height: 58px; place-items: center; margin: 0 auto 18px; border: 1px solid #ef1b2355; border-radius: 18px; color: #ff555b; background: #ef1b2317; font-size: 25px; }
      h1 { margin: 0; font-size: clamp(25px, 7vw, 34px); letter-spacing: -.04em; }
      p { margin: 12px 0 0; color: #b8b8bc; font-size: 14px; line-height: 1.7; }
      button { width: 100%; margin-top: 26px; padding: 14px 18px; border: 0; border-radius: 12px; color: #fff; background: #ef1b23; font: inherit; font-size: 14px; font-weight: 750; cursor: pointer; }
      button:hover { background: #d9141c; }
      button:focus-visible { outline: 3px solid #fff; outline-offset: 3px; }
      .note { margin-top: 16px; font-size: 12px; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icons/icon-512.png" alt="SAREX Fitness Clinic" />
      <div class="mark" aria-hidden="true">↗</div>
      <h1>You’re offline.</h1>
      <p>An internet connection is required to access your membership, workouts, payments, attendance, QR check-in, and other live account information.</p>
      <button type="button" onclick="window.location.reload()">Try Again</button>
      <p class="note">Your account information and check-ins are never available offline.</p>
    </main>
  </body>
</html>
